name: بناء ملف APK تلقائياً

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: تحميل الكود
        uses: actions/checkout@v4

      - name: تثبيت Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: توليد مجلد أندرويد في مكان منفصل (بدون المساس بالكود ديالنا)
        run: |
          flutter create --platforms=android --project-name phone_repair_manager --org com.repairshop /tmp/scaffold
          cp -r /tmp/scaffold/android .
          rm -rf /tmp/scaffold

      - name: إنشاء مفتاح توقيع Debug (إن لم يكن موجوداً)
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: تعطيل واجهة AGP 9 الجديدة (توافق أفضل)
        run: echo "android.newDsl=false" >> android/gradle.properties

      - name: تبديل اسم التطبيق الظاهر تحت الأيقونة
        run: sed -i 's/android:label="[^"]*"/android:label="Hakim_app"/' android/app/src/main/AndroidManifest.xml

      - name: تحميل الحزم
        run: flutter pub get

      - name: بناء ملف APK (مع تجاوز فحص إصدار Kotlin)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: عرض بصمة SHA-1 لشهادة التوقيع (Debug)
        run: keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android

      - name: نشر الـ APK في Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "نسخة رقم ${{ github.run_number }}"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
